<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>프로젝트 관리 | JOO SONG PORTFOLO</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root {font-family:Pretendard,sans-serif;color:#191f28;background:#f7f9fc;font-size:15px;line-height:1.55}
* {box-sizing:border-box}
body {margin:0}
header {padding:22px 28px;background:#fff;border-bottom:1px solid #e5e8eb;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand {font-family:Outfit,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.035em}
a {color:#3182f6;text-decoration:none}
main {max-width:1220px;margin:40px auto;padding:0 24px;display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:25px;align-items:start}
.panel {background:#fff;border:1px solid #e5e8eb;border-radius:22px;padding:25px;box-shadow:0 8px 30px #162c4810}
h1 {font-size:23px;margin:0 0 7px}
h2 {font-size:19px;margin:0 0 18px}
p {color:#697386;margin:0 0 22px}
label {display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea {width:100%;font:inherit;padding:11px 12px;border:1px solid #d9e0e9;border-radius:10px;background:#fff;color:#191f28}
textarea {min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus {outline:2px solid #3182f6;outline-offset:1px}
.fields {display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check {display:flex;gap:8px;align-items:center;margin:20px 0}
.check input {width:18px;height:18px}
.check label {margin:0}
.actions {display:flex;gap:9px;flex-wrap:wrap}
button {font:inherit;border:0;cursor:pointer;border-radius:10px;padding:11px 17px;font-weight:600}
.primary {background:#3182f6;color:white}
.ghost {background:#eef3fc;color:#263f60}
.danger {background:#fff0f0;color:#af3030}
.item {display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #eef0f3}
.item img {width:86px;height:70px;object-fit:cover;border-radius:10px;background:#edf3ff}
.item strong {display:block;font-size:15px}
.meta {font-size:12px;color:#8993a5}
.item button {padding:7px 10px;font-size:12px}
.status {margin-top:14px;white-space:pre-line;color:#3182f6}
.preview {max-width:160px;max-height:115px;object-fit:cover;margin-top:9px;border-radius:8px;display:none}
.help {font-size:12px;color:#8b95a1;margin:3px 0}
footer {padding:20px;text-align:center;color:#8b95a1;font-size:12px}
@media(max-width:830px) {main {grid-template-columns:1fr;margin:20px auto}.panel {padding:20px}}
@media(max-width:520px) {.item {grid-template-columns:60px 1fr;gap:9px}.item img {width:60px;height:60px}.item .actions {grid-column:2}.fields {grid-template-columns:1fr}}
</style>
</head>
<body>
<header><span class="brand">JOO SONG <span style="color:#3182f6">PORTFOLO</span> / ADMIN</span><a href="/" target="_blank" rel="noopener noreferrer">사이트 열기 ↗</a></header>
<main>
<section class="panel" aria-labelledby="form-title">
<h1 id="form-title">프로젝트 등록</h1>
<p>이미지와 프로젝트 정보를 직접 업로드해 공개할 수 있습니다.</p>
<form id="form">
<input type="hidden" id="project-id">
<input type="hidden" id="image-key">
<label for="name">프로젝트명 *</label><input id="name" required maxlength="120" placeholder="예: 브랜드 리뉴얼 홈페이지">
<div class="fields"><div><label for="category">카테고리 *</label><select id="category"><option value="custom">제작형</option><option value="template">템플릿</option></select></div><div><label for="year">제작 연도</label><input id="year" type="number" min="1990" max="2100" placeholder="2026"></div></div>
<label for="slug">페이지 주소 영문 (선택)</label><input id="slug" pattern="[a-z0-9][a-z0-9-]{2,90}" placeholder="예: brand-renewal"><div class="help">비워두면 고유 주소가 자동 생성됩니다. 등록 후 주소 변경 시 기존 링크가 변경됩니다.</div>
<div class="fields"><div><label for="industry">업종</label><input id="industry" maxlength="100" placeholder="병원 / 기업 / 교육"></div><div><label for="sort-order">정렬 순서</label><input id="sort-order" type="number" value="0" min="-100000" max="100000"></div></div>
<label for="role">담당 업무</label><input id="role" maxlength="180" placeholder="웹디자인 · 퍼블리싱">
<label for="tech">기술 태그 (쉼표 구분)</label><input id="tech" placeholder="Figma, HTML, CSS, GSAP">
<label for="summary">프로젝트 소개</label><textarea id="summary" maxlength="2000" placeholder="제작 목적과 담당 업무를 간단히 입력하세요."></textarea>
<label for="url">실제 사이트 URL</label><input id="url" type="url" placeholder="https://example.com">
<label for="file">썸네일 이미지 (JPG · PNG · WebP, 5MB 이하)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" alt="등록 이미지 미리보기"><div class="help">이미지 교체 시 기존 파일은 서버에 남을 수 있습니다. 정기적인 R2 파일 정리가 필요합니다.</div>
<div class="check"><input type="checkbox" id="published"><label for="published">공개하기 (체크 해제 시 임시저장)</label></div>
<div class="actions"><button class="primary" type="submit" id="submit">프로젝트 등록</button><button class="ghost" type="button" id="reset">새로 작성</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</form>
</section>
<section class="panel"><h2>등록된 프로젝트</h2><p>수정 · 삭제 · 공개/비공개 상태를 관리할 수 있습니다.</p><div id="project-list" aria-live="polite">불러오는 중...</div></section>
</main><footer>관리자 페이지와 API는 Cloudflare Access 인증으로 보호해야 합니다.</footer>
<script src="/admin/admin.js" defer></script>
</body></html>
